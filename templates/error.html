{% extends 'base.html' %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<section class="panel error-panel"><span class="error-code">{{ code }}</span><h1>{{ message }}</h1><a class="button primary" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}">返回{{ '工作台' if current_user.is_authenticated else '登录' }}</a></section>
{% endblock %}
